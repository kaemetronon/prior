services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Относительный путь: фронт будет ходить на бэкенд по тому же хосту/IP,
        # с которого его открыли (через nginx-прокси). Не завязано на домен,
        # поэтому при смене IP или возврате домена ничего менять не нужно.
        REACT_APP_BACKEND_URL: /api
    image: priority-frontend:latest
    container_name: tasktracker-frontend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: priority-backend:latest
    container_name: tasktracker-backend
    ports:
      - "8080:8080"
    env_file:
      - ./env/backend.env
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: tasktracker-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    command: /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  # certbot отключён: без домена Let's Encrypt не выдаёт и не продлевает
  # сертификаты (для голого IP это невозможно в принципе). Порт 443 и
  # монтирование ./certbot/* убраны из сервиса nginx выше.
  # Как вернуть — см. DOMAIN_SETUP.md в корне проекта.
  # certbot:
  #   image: certbot/certbot
  #   container_name: tasktracker-certbot
  #   volumes:
  #     - ./certbot/www:/var/www/certbot
  #     - ./certbot/conf:/etc/letsencrypt
  #   entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"

  postgres:
    image: postgres:16-alpine
    container_name: tasktracker-postgres
    ports:
      - "5432:5432"
    env_file:
      - ./env/postgres.env
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
